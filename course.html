ar(--pale);padding:22px}.track h3{font-size:18px;margin:0 0 10px}.track p{font-size:13px}.note{border-left:3px solid var(--green);padding:12px 20px;background:var(--pale);margin-top:30px}.contact{background:var(--green);color:white;padding:50px 0}.contact a{font-weight:700}footer{font-size:12px;color:var(--muted);padding:20px 0}@media(max-width:720px){.shell{width:calc(100% - 36px)}nav{min-height:68px}.nav-right{gap:10px}.link{font-size:12px}.hero{padding:55px 0 36px}.summary,.lesson-body,.safeguards,.tracks,.lab{grid-template-columns:1fr}.summary{gap:8px}.lesson-head{grid-template-columns:55px 1fr;gap:12px}.lesson-id{font-size:40px}.lesson{padding:30px 0 40px}.lab{gap:10px}.course-tabs a{min-width:44px}.lede{font-size:17px}}</style></head><body><header><nav class="shell"><a class="brand" href="./">Fred E.</a><div class="nav-right"><a class="link" href="./" id="back">← Portfolio</a><div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="zh" aria-pressed="false">中文</button></div></div></nav></header><main><div class="shell hero"><div class="eyebrow" id="prelim"></div><h1 id="hero"></h1><p class="lede" id="intro"></p></div><div class="shell summary"><p id="audience"></p><p id="format"></p></div><section><div class="shell"><div class="course-top"><div><div class="eyebrow" id="aboutLabel"></div><h2 id="about"></h2></div><span class="pill">6 × 2h</span></div><p id="explain"></p><div class="course-tabs" id="tabs"></div><div id="lessons"></div></div></section><section><div class="shell"><div class="eyebrow">DATA · EVALUATION · SECURITY</div><h2 id="risks"></h2><p id="riskintro"></p><div class="safeguards" id="safeguards"></div></div></section><section><div class="shell"><h2 id="examples"></h2><div class="tracks" id="tracks"></div><div class="note" id="closing"></div></div></section><section><div class="shell"><h2 id="deliver"></h2><ol id="outcomes"></ol></div></section><div class="contact"><div class="shell"><h2 id="contact"></h2><a href="mailto:Fredilly@article6.org">Fredilly@article6.org ↗</a></div></div></main><footer class="shell">Fred E. · Preliminary training framework · © 2026</footer><script>
const lessons=[{"n":"01","en":{"title":"Business opportunity mapping","sub":"Start with the work, not the model.","goals":["Explain where LLMs, assistants and agents differ and where each is useful.","Map a business process with its people, decisions, systems and friction.","Select a small, measurable opportunity with a named business owner."],"agenda":[["00–20","LLMs and agents: plain-language briefing and examples"],["20–45","Walk through a sales, operations or research workflow"],["45–85","Group exercise: map a real workflow and identify bottlenecks"],["85–110","Score opportunities by value, complexity and risk"],["110–120","Review, questions and next steps"]],"lab":"Use a workflow canvas to describe the trigger, input data, decisions, outputs, people and failure points. Compare an agent with a simple non-AI automation.","output":"One-page opportunity canvas, baseline metric and success criterion.","home":"Interview one workflow owner; bring an anonymized process sample."},"zh":{"title":"企业 AI 场景识别","sub":"从业务出发，而不是从模型出发。","goals":["理解大语言模型、AI 助手和智能体的区别及适用场景。","梳理业务流程中的人员、决策、系统和痛点。","选择一个范围明确、效果可量化、责任人清晰的试点场景。"],"agenda":[["00–20","用商业语言理解大模型与智能体，介绍常见案例"],["20–45","分析销售、运营或市场研究中的典型流程"],["45–85","分组练习：绘制真实业务流程，识别瓶颈"],["85–110","按商业价值、实施难度和风险评估机会"],["110–120","成果交流、答疑及课后任务"]],"lab":"使用业务流程画布描述触发条件、输入数据、关键决策、输出成果、相关人员及故障点，并比较智能体与传统自动化。","output":"一页业务机会画布、当前基线指标和试点成功标准。","home":"访谈一名业务负责人，带来去标识化的流程样本。"}},{"n":"02","en":{"title":"LLMs, agents and tools","sub":"Understand what is being built before building it.","goals":["Describe prompts, context, retrieval, tool calls and human approval in simple terms.","Recognize hallucinations, inconsistent outputs and vendor-dependent capabilities.","Write a task specification that can be used across suitable platforms."],"agenda":[["00–20","Live contrast: chatbot response vs tool-enabled workflow"],["20–45","Model, instructions, context, data and tools"],["45–85","Guided exercise: turn a vague request into a testable specification"],["85–110","Choose model/platform criteria: access, privacy, cost and reliability"],["110–120","Review the specification"]],"lab":"Define an agent's job, inputs, expected output format, allowed tools, stop conditions, escalation path and human approval checkpoints.","output":"Platform-neutral agent brief and input/output contract.","home":"Collect 5 representative tasks and 3 cases where the agent should refuse or escalate."},"zh":{"title":"大模型、智能体与工具","sub":"先理解系统，再开始搭建。","goals":["用简单语言解释提示词、上下文、检索、工具调用和人工审批。","识别模型幻觉、输出不稳定与不同厂商的能力差异。","写出能在不同平台实施的任务说明书。"],"agenda":[["00–20","演示对比：聊天回答与工具驱动的工作流程"],["20–45","模型、指令、上下文、数据和工具"],["45–85","指导练习：把模糊需求转化为可测试的规格"],["85–110","按可用性、隐私、成本和可靠性筛选平台"],["110–120","任务说明书点评"]],"lab":"明确智能体任务、输入、输出格式、允许调用的工具、停止条件、异常升级路径与人工审批节点。","output":"跨平台智能体需求说明书、输入与输出约定。","home":"收集 5 个典型任务与 3 个应拒绝或转人工的案例。"}},{"n":"03","en":{"title":"Company data and access","sub":"The business data is the most important input.","goals":["Identify relevant data sources and their business owners.","Classify public, internal, confidential and regulated information.","Create a safe data contract with permissions and quality checks."],"agenda":[["00–20","Data walk-through: documents, spreadsheets, CRM and databases"],["20–45","Data quality, provenance, classification and ownership"],["45–85","Lab: make a data inventory and safe sample dataset"],["85–110","Choose retrieval and integration boundaries"],["110–120","Data-readiness checkpoint"]],"lab":"Build a small sanitized dataset, mark permitted fields, document who may access it and identify how the agent handles missing or contradictory records.","output":"Data map, permission matrix and sanitized practice dataset.","home":"Request data-owner approval for any later use of real records."},"zh":{"title":"企业数据与访问权限","sub":"企业数据是最重要的业务输入。","goals":["识别相关数据来源及负责管理数据的业务人员。","区分公开、内部、机密和受监管信息。","制定包含权限和质量检查的数据使用约定。"],"agenda":[["00–20","认识文档、表格、CRM 和数据库等数据来源"],["20–45","数据质量、来源、分类分级与归属"],["45–85","实操：制作数据清单与安全样本数据集"],["85–110","确定检索与系统集成边界"],["110–120","数据准备情况检查"]],"lab":"创建经过脱敏的样本数据，标记允许使用的字段，说明访问权限，并约定数据缺失或相互矛盾时的处理方法。","output":"企业数据地图、权限矩阵及安全练习数据集。","home":"在后续使用真实记录前取得数据负责人批准。"}},{"n":"04","en":{"title":"Build a bounded business agent","sub":"One workflow, useful output, visible controls.","goals":["Assemble a narrowly scoped agent using an approved model and environment.","Connect sample data and produce a consistent, auditable output.","Place human review before external messages, data changes or other consequential actions."],"agenda":[["00–20","Review system design and tool boundaries"],["20–45","Instructor builds one simple agent end-to-end"],["45–90","Guided lab: implement a chosen business track"],["90–110","Inspect logs, errors and approval gates"],["110–120","Demo checkpoint"]],"lab":"Choose sales reporting, operations exception review or sourced market research. Build input validation, an agent task, structured output and a manual approval stage.","output":"Working prototype with documented limitations and approved-data boundary.","home":"Run the prototype on 10 approved examples; note surprises."},"zh":{"title":"搭建边界清晰的业务智能体","sub":"一个具体流程、可用结果、可见控制。","goals":["在获批准的平台和模型环境中完成范围明确的智能体。","连接练习数据，形成一致且可审计的输出。","在对外发送、修改数据等重要操作前设置人工审批。"],"agenda":[["00–20","复核系统设计与工具权限边界"],["20–45","讲师从头演示构建一个简单智能体"],["45–90","指导实操：完成所选业务方向"],["90–110","检查日志、异常与人工审批机制"],["110–120","原型展示检查"]],"lab":"在销售报告、运营异常分析或带来源的市场研究中选择一个方向，实现输入校验、智能体任务、结构化输出和人工审批。","output":"一个可运行的原型及其限制说明和数据使用边界。","home":"使用 10 个已获批准的案例测试原型，记录意外结果。"}},{"n":"05","en":{"title":"Evaluation harness and security","sub":"Do not confuse a convincing demo with a dependable system.","goals":["Build a versioned test set of representative and adversarial cases.","Measure correctness, task completion, privacy risks, unsafe actions, time and cost.","Apply least privilege, secret handling, approval steps and traceability."],"agenda":[["00–25","What can fail: hallucination, prompt injection and unauthorized action"],["25–50","Create a golden test set and baseline"],["50–90","Lab: run regression tests after one deliberate change"],["90–110","Security review and incident-response exercise"],["110–120","Readiness verdict"]],"lab":"Test normal, ambiguous, missing-data, contradictory and unauthorized requests. Log expected vs actual outputs, classify failures, fix one issue, then rerun the entire harness.","output":"Reusable evaluation harness, result log, risk register and security checklist.","home":"Document the three highest risks and who approves each mitigation."},"zh":{"title":"评测体系与数据安全","sub":"有说服力的演示，不等于可靠的系统。","goals":["建立包含典型与对抗性案例的版本化测试集。","衡量正确性、完成率、隐私风险、错误操作、速度和成本。","落实最小权限、密钥管理、审批和可追溯性。"],"agenda":[["00–25","常见风险：模型幻觉、提示注入和越权操作"],["25–50","建立黄金测试集并取得基线结果"],["50–90","实操：修改一项配置后运行回归测试"],["90–110","安全检查与事件响应演练"],["110–120","项目就绪度评估"]],"lab":"测试正常、模糊、缺失数据、证据矛盾和无权限请求。记录预期与实际输出，归类失败，修复一个问题后重新运行全部测试。","output":"可重复评测体系、结果日志、风险清单与安全检查表。","home":"记录最重要的三项风险及其审批责任人。"}},{"n":"06","en":{"title":"Executive demo and rollout","sub":"Decide what deserves to move beyond a pilot.","goals":["Present the business outcome and evidence, not only the user interface.","Make an informed go / revise / stop decision.","Plan support, ownership, monitoring and phased deployment."],"agenda":[["00–20","Review success metrics and deployment gates"],["20–75","Participant demos with test evidence"],["75–100","Peer review: value, risks, data and operational fit"],["100–115","Write a 30/60/90-day rollout roadmap"],["115–120","Wrap-up and next actions"]],"lab":"Present the workflow, data map, working prototype, evaluation results, unresolved risks, estimated ongoing effort and a human-approved rollout recommendation.","output":"Executive demo, evaluation report and conditional implementation roadmap.","home":"Optional follow-up discovery workshop with enterprise stakeholders."},"zh":{"title":"管理层演示与上线规划","sub":"决定哪些试点值得进入下一阶段。","goals":["展示商业成果与测试证据，而不只是界面。","根据证据作出继续、修改或停止的决策。","规划负责人、监控、维护与分阶段实施。"],"agenda":[["00–20","复核成功指标与上线门槛"],["20–75","学员演示原型和测试结果"],["75–100","交叉评审：价值、风险、数据及业务适配"],["100–115","撰写 30/60/90 天实施路线图"],["115–120","课程总结及后续安排"]],"lab":"展示业务流程、数据地图、工作原型、评测结果、未解决风险、持续运维投入与需人工批准的上线建议。","output":"管理层成果展示、评测报告与有条件的实施路线图。","home":"可选：与企业相关负责人开展后续场景诊断工作坊。"}}],str={"en":{"nav":"Course","hero":"From business problems to useful AI agents.","intro":"A hands-on executive course for teams that want to understand AI, build one useful workflow, and know when it is safe to deploy.","prelim":"PRELIMINARY COURSE FRAMEWORK · ADAPTABLE BY INDUSTRY","about":"The learning journey","explain":"Six instructor-led sessions. One business problem. A working prototype with test evidence and security boundaries.","audience":"For founders, senior executives and team leaders. No previous programming required.","format":"6 sessions · 2 hours each · Live or adaptable to recorded and in-person delivery","deliver":"Participants leave with","outcomes":["Business opportunity canvas","Agent specification and company-data map","Working, bounded prototype","Evaluation harness and risk checklist","Executive implementation roadmap"],"agenda":"120-minute lesson plan","goals":"Learning objectives","lab":"In-class practical","output":"Evidence / deliverable","home":"Between sessions","risks":"Cross-industry safeguards","riskintro":"Real company data is never assumed safe to upload. These controls apply across all modules.","risklist":[["Company data","Classify records, establish ownership, use synthetic or approved de-identified practice data, and confirm vendor processing and retention."],["Evaluation harness","Preserve repeatable normal, edge, refusal and adversarial tests. Compare results after every change; investigate regressions."],["Security","Least privilege, secrets management, audit logs, approved integrations, human review and rollback for consequential actions."],["Industry fit","Healthcare places patient privacy and clinical oversight first; finance emphasizes transaction authorization and auditability; manufacturing prioritizes equipment and physical safety."]],"examples":"Example project tracks","tracks":[["Sales intelligence","Turn approved CRM exports into a manager-reviewed pipeline summary."],["Operations","Flag inventory exceptions and propose actions for human review."],["Research","Produce evidence-linked industry briefs from permitted sources."]],"closing":"Final curriculum, models, tools, duration and real-data permissions depend on each company's structure, sector, network access, risk tolerance and learners. A course prototype is not a production deployment.","back":"← Portfolio","contact":"Discuss a cohort","hour":"2 hours"},"zh":{"nav":"课程","hero":"从业务问题到真正有用的 AI 智能体。","intro":"面向企业管理者的实战课程：理解 AI、完成一项真实业务流程的原型，并判断何时可以安全落地。","prelim":"初步课程框架 · 可根据行业与组织调整","about":"课程学习路径","explain":"六次讲师带领的课程，一个具体业务问题，最终完成带有测试证据和安全边界的工作原型。","audience":"适合企业创始人、高管及部门负责人，无需编程基础。","format":"6 节课 · 每节 2 小时 · 可在线直播、录播或企业线下内训","deliver":"学员结课成果","outcomes":["业务机会分析画布","智能体需求书与企业数据地图","边界清晰的可运行原型","评测体系与风险检查表","面向管理层的实施路线图"],"agenda":"120 分钟课堂流程","goals":"学习目标","lab":"课堂实践","output":"课程成果","home":"课后练习","risks":"跨行业通用安全要求","riskintro":"不能默认允许上传真实企业数据。以下控制要求贯穿所有课程模块。","risklist":[["企业数据","先分类分级、明确数据归属，练习使用合成或获准脱敏数据，并确认服务商的数据处理与保留规则。"],["评测体系","保留可重复运行的正常、边界、拒绝与对抗测试。每次改动后对比结果并调查回归问题。"],["安全控制","落实最小权限、密钥管理、审计日志、获批系统集成、重要操作人工审批及回滚方案。"],["行业适配","医疗优先考虑患者隐私和临床监督；金融重视交易授权与审计；制造业优先考虑设备和人身安全。"]],"examples":"可选择的实战方向","tracks":[["销售分析","使用获准的 CRM 数据，生成经理审核的销售管道报告。"],["企业运营","发现库存异常，形成供人工复核的行动建议。"],["市场研究","从允许使用的信息源生成带有证据链接的行业简报。"]],"closing":"最终课程、模型、工具、时长及真实数据权限须根据企业结构、行业、网络访问条件、风险承受能力与学员基础调整。课程原型不等于生产环境上线。","back":"← 返回作品集","contact":"洽谈企业课程","hour":"2 小时"}};
const $=id=>document.getElementById(id);const escapeHTML=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function render(lang){const s=str[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=(lang==='zh'?'课程':'Course')+' | Fred E.';
for(const key of ['prelim','hero','intro','audience','format','about','explain','deliver','risks','riskintro','examples','closing','contact'])$(key).textContent=s[key];
$('aboutLabel').textContent=lang==='zh'?'课程安排':'COURSE ROADMAP';$('back').textContent=s.back;
$('tabs').innerHTML=lessons.map(l=>'<a href="#lesson-'+l.n+'">'+l.n+'</a>').join('');
$('lessons').innerHTML=lessons.map(l=>{let x=l[lang];return '<article class="lesson" id="lesson-'+l.n+'"><div class="lesson-head"><span class="lesson-id">'+l.n+'</span><div><h3>'+escapeHTML(x.title)+'</h3><p class="subtitle">'+escapeHTML(x.sub)+'</p></div></div><div class="lesson-body"><div><div class="label">'+s.goals+'</div><ul class="goals">'+x.goals.map(g=>'<li>'+escapeHTML(g)+'</li>').join('')+'</ul></div><div><div class="label">'+s.agenda+'</div><div class="timeline">'+x.agenda.map(a=>'<div class="slot"><time>'+a[0]+'</time><span>'+escapeHTML(a[1])+'</span></div>').join('')+'</div></div></div><div class="lab"><div><strong>'+s.lab+'</strong><p>'+escapeHTML(x.lab)+'</p></div><div><strong>'+s.output+'</strong><p>'+escapeHTML(x.output)+'</p><strong>'+s.home+'</strong><p>'+escapeHTML(x.home)+'</p></div></div></article>'}).join('');
$('safeguards').innerHTML=s.risklist.map((x,i)=>'<article class="safety"><div class="eyebrow">0'+(i+1)+'</div><h3>'+escapeHTML(x[0])+'</h3><p>'+escapeHTML(x[1])+'</p></article>').join('');
$('tracks').innerHTML=s.tracks.map(x=>'<article class="track"><h3>'+escapeHTML(x[0])+'</h3><p>'+escapeHTML(x[1])+'</p></article>').join('');
$('outcomes').innerHTML=s.outcomes.map(x=>'<li>'+escapeHTML(x)+'</li>').join('');
document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
try{localStorage.setItem('fred-e-language',lang)}catch(e){}
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.lang)));
let lang='en';try{if(localStorage.getItem('fred-e-language')==='zh')lang='zh'}catch(e){}render(lang);
</script></body></html>
